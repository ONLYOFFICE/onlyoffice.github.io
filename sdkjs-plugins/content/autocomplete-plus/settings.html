<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Autocomplete settings</title>
	<script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
	<script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"></script>
	<link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
	<style>
		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			padding: 0;
		}
		#settings {
			padding: 16px;
		}
		.row {
			display: flex;
			align-items: center;
			min-height: 28px;
		}
		.row label {
			flex: 1;
			cursor: pointer;
		}
		.row input[type="checkbox"] {
			margin: 0 8px 0 0;
		}
		.row input[type="number"] {
			width: 60px;
		}
		.row button {
			min-width: 60px;
		}
		.row button + button {
			margin-left: 4px;
		}
		.row label:not([for]) {
			cursor: default;
		}
		.count {
			margin: 0 8px;
			opacity: 0.6;
		}
		.header {
			font-weight: bold;
			margin: 10px 0 2px 0;
		}
		.header:first-child {
			margin-top: 0;
		}
	</style>
	<script src="scripts/settings.js"></script>
</head>
<body class="noselect">
	<div id="settings">
		<div class="header i18n">Languages</div>
		<div class="row">
			<input type="checkbox" id="german">
			<label for="german" class="i18n">German</label>
		</div>
		<div class="row">
			<input type="checkbox" id="english">
			<label for="english" class="i18n">English</label>
		</div>
		<div class="header i18n">Suggestions</div>
		<div class="row">
			<label id="pauseState"></label>
			<button id="togglePause" class="btn-text-default"></button>
		</div>
		<div class="row">
			<input type="checkbox" id="capitalize">
			<label for="capitalize" class="i18n">Capitalise German nouns</label>
		</div>
		<div class="row">
			<input type="checkbox" id="learn">
			<label for="learn" class="i18n">Show the words I choose first</label>
		</div>
		<div class="row">
			<input type="checkbox" id="addSpace">
			<label for="addSpace" class="i18n">Add a space after the chosen word</label>
		</div>
		<div class="row">
			<label for="minLength" class="i18n">Letters before suggesting</label>
			<input type="number" id="minLength" class="form-control" min="1" max="6" step="1">
		</div>
		<div class="row">
			<label for="maxItems" class="i18n">Maximum number of suggestions</label>
			<input type="number" id="maxItems" class="form-control" min="1" max="100" step="1">
		</div>
		<div class="header i18n">Your words</div>
		<div class="row">
			<label class="i18n">Personal dictionary</label>
			<span class="count" id="personalCount"></span>
			<button data-edit="personal" class="btn-text-default i18n">Edit</button>
		</div>
		<div class="row">
			<label class="i18n">Ignored words</label>
			<span class="count" id="ignoredCount"></span>
			<button data-edit="ignored" class="btn-text-default i18n">Edit</button>
		</div>
		<div class="row">
			<label class="i18n">Text snippets</label>
			<span class="count" id="snippetsCount"></span>
			<button data-edit="snippets" class="btn-text-default i18n">Edit</button>
		</div>
		<div class="row">
			<label class="i18n">Learned words</label>
			<span class="count" id="learnedCount"></span>
			<button data-edit="learned" class="btn-text-default i18n">Edit</button>
			<button id="resetLearned" class="btn-text-default i18n">Reset</button>
		</div>
	</div>
</body>
</html>
