<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Insert numbered equation</title>
    <script
      type="text/javascript"
      src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"
    ></script>
    <script
      type="text/javascript"
      src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins-ui.js"
    ></script>
    <style>
      :root {
        --bg: #ffffff;
        --text: #444444;
        --border: #c0c0c0;
        --primary: #4473ca;
        --primary-text: #ffffff;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 12px 16px;
        background: var(--bg);
        color: var(--text);
        font:
          12px Arial,
          Helvetica,
          sans-serif;
      }
      fieldset {
        border: none;
        margin: 0 0 10px;
        padding: 0;
      }
      legend {
        font-weight: bold;
        margin-bottom: 4px;
        padding: 0;
      }
      label {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        margin-right: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 4px 0 4px 20px;
      }
      input[type='text'],
      input[type='number'],
      select {
        height: 22px;
        padding: 0 4px;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
      }
      input[type='number'] {
        width: 60px;
      }
      input[type='text'],
      select {
        flex: 1;
        min-width: 0;
      }
      input:disabled,
      select:disabled {
        opacity: 0.5;
      }
      .buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 14px;
      }
      button {
        min-width: 80px;
        height: 24px;
        border: 1px solid var(--border);
        border-radius: 2px;
        background: var(--bg);
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--primary);
        border-color: var(--primary);
        color: var(--primary-text);
      }
    </style>
  </head>
  <body>
    <form id="form">
      <fieldset>
        <legend>Alignment</legend>
        <label>
          <input type="radio" name="align" value="center" checked />
          Centered
        </label>
        <label>
          <input type="radio" name="align" value="left" />
          Left
        </label>
      </fieldset>

      <fieldset>
        <legend>Number</legend>
        <label>
          <input type="checkbox" id="addTitle" />
          Prefix with title number (n.x)
        </label>
        <div class="row">
          Title style
          <select id="titleStyle"></select>
        </div>
      </fieldset>

      <fieldset>
        <legend>Bookmark</legend>
        <div class="row" style="margin-left: 0">
          Name
          <span id="bookmarkPrefix"></span>
          <input type="text" id="bookmarkName" maxlength="40" />
        </div>
      </fieldset>

      <div class="buttons">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Insert</button>
      </div>
    </form>

    <script type="text/javascript" src="settings-store.js"></script>
    <script type="text/javascript" src="window-fit.js"></script>
    <script type="text/javascript" src="options.js"></script>
  </body>
</html>
