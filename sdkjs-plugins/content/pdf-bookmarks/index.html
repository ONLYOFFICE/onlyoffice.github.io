<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDF Bookmarks</title>
    <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="panel" aria-labelledby="panel-title">
      <header class="panel-header">
        <div>
          <h1 id="panel-title">PDF Bookmarks</h1>
          <p id="document-name" class="document-name">Current PDF</p>
        </div>
        <div id="page-pill" class="page-pill" aria-live="polite">Page —</div>
      </header>

      <section class="add-card" aria-labelledby="add-title">
        <h2 id="add-title">Add a bookmark</h2>
        <label for="bookmark-name">Name</label>
        <input
          id="bookmark-name"
          type="text"
          maxlength="120"
          autocomplete="off"
          placeholder="Page name"
        >
        <button id="add-bookmark" class="primary" type="button" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M7 4.75A1.75 1.75 0 0 1 8.75 3h6.5A1.75 1.75 0 0 1 17 4.75V21l-5-3.2L7 21V4.75Z"/>
            <path d="M12 7v6M9 10h6"/>
          </svg>
          Bookmark current page
        </button>
      </section>

      <section class="bookmarks-section" aria-labelledby="saved-title">
        <div class="section-heading">
          <h2 id="saved-title">Saved bookmarks <span id="bookmark-count">0</span></h2>
          <button id="clear-all" class="text-button danger" type="button" hidden>Clear all</button>
        </div>
        <div id="empty-state" class="empty-state" hidden>
          <svg aria-hidden="true" viewBox="0 0 48 48">
            <path d="M15 8.5A3.5 3.5 0 0 1 18.5 5h11A3.5 3.5 0 0 1 33 8.5V42l-9-5.8L15 42V8.5Z"/>
            <path d="M20 15h8M20 21h8"/>
          </svg>
          <p>No bookmarks in this PDF yet.</p>
          <span>Move to a page and add your first one.</span>
        </div>
        <ol id="bookmark-list" class="bookmark-list" aria-live="polite" hidden></ol>
      </section>

      <footer>
        <p id="status" class="status" role="status" aria-live="polite"></p>
        <p id="storage-note" class="storage-note">Saved locally on this computer.</p>
      </footer>
    </main>

    <script src="bookmarks-store.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
