<!-- Форма включает независимые функции автоисправления и выбор языка. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TilType</title>
  <link rel="stylesheet" href="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.css">
  <link rel="stylesheet" href="resources/settings.css">
  <script src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
  <script defer src="scripts/settings.js"></script>
  <script defer src="scripts/settings-dialog.js"></script>
</head>
<body>
  <form id="preferences" hidden>
    <label><input type="checkbox" id="spelling"><span data-text="spelling"></span></label>
    <label><input type="checkbox" id="layout"><span data-text="layout"></span></label>
    <label><input type="checkbox" id="proofing"><span data-text="proofing"></span></label>
    <label><input type="checkbox" id="punctuation"><span data-text="punctuation"></span></label>
    <label><input type="checkbox" id="space-after-enter"><span data-text="spaceAfterEnter"></span></label>
    <label class="language">
      <span data-text="language"></span>
      <select id="language" class="form-control">
        <option value="auto" data-text="auto"></option>
        <option value="ru" lang="ru">Русский</option>
        <option value="kk" lang="kk">Қазақша</option>
        <option value="en" lang="en">English</option>
      </select>
    </label>
    <p data-text="detail"></p>
    <p id="error" role="alert" data-text="error" hidden></p>
    <div class="actions">
      <button type="button" id="cancel" class="btn-text-default" data-text="cancel"></button>
      <button type="submit" class="btn-text-default primary" data-text="save"></button>
    </div>
  </form>
</body>
</html>
